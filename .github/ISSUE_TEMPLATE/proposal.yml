name: Proposal
description: 提出有阶段边界和验收标准的改进。
title: "[Proposal] "
body:
  - type: input
    id: phase
    attributes:
      label: 所属阶段
      description: 对照 docs/roadmap，明确本次提案在哪个阶段。
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 真实场景、现有方案不足，以及原始需求依据。
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 方案与非目标
      description: 包括模块边界和替代方案；不要把未来能力写成已实现。
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 验收与风险
      description: 如何验证、是否影响协议、授权、隐私或兼容性。
    validations:
      required: true
